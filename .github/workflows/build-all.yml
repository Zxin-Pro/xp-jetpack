name: Build All Versions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: '构建完成后创建 Release（把 22 个 jar 挂上去，方便下载测试）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.loader }} ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # 22 个 Gradle 作业同时拉依赖对 Fabric/Maven 压力较大，限流到 4 个一批。
      # （注：此前 fabric 作业失败的真因是缺 Gradle JVM 25，见下面 JDK 步骤，与并发无关。）
      max-parallel: 4
      matrix:
        include:
          - { branch: 'forge-1.20.1',    loader: 'forge',    mc: '1.20.1',  java: '17' }
          - { branch: 'forge-1.20.2',    loader: 'forge',    mc: '1.20.2',  java: '17' }
          - { branch: 'forge-1.20.4',    loader: 'forge',    mc: '1.20.4',  java: '17' }
          - { branch: 'neoforge-1.20.6', loader: 'neoforge', mc: '1.20.6',  java: '21' }
          - { branch: 'neoforge-1.21.1', loader: 'neoforge', mc: '1.21.1',  java: '21' }
          - { branch: 'neoforge-1.21.4', loader: 'neoforge', mc: '1.21.4',  java: '21' }
          - { branch: 'neoforge-1.21.8', loader: 'neoforge', mc: '1.21.8',  java: '21' }
          - { branch: 'neoforge-1.21.11', loader: 'neoforge', mc: '1.21.11', java: '21' }
          - { branch: 'neoforge-26.1',   loader: 'neoforge', mc: '26.1',    java: '25' }
          - { branch: 'neoforge-26.2',   loader: 'neoforge', mc: '26.2',    java: '25' }
          - { branch: 'neoforge-26.3',   loader: 'neoforge', mc: '26.3',    java: '25' }
          - { branch: 'fabric-1.20.1',   loader: 'fabric',   mc: '1.20.1',  java: '17' }
          - { branch: 'fabric-1.20.2',   loader: 'fabric',   mc: '1.20.2',  java: '17' }
          - { branch: 'fabric-1.20.4',   loader: 'fabric',   mc: '1.20.4',  java: '17' }
          - { branch: 'fabric-1.20.6',   loader: 'fabric',   mc: '1.20.6',  java: '21' }
          - { branch: 'fabric-1.21.1',   loader: 'fabric',   mc: '1.21.1',  java: '21' }
          - { branch: 'fabric-1.21.4',   loader: 'fabric',   mc: '1.21.4',  java: '21' }
          - { branch: 'fabric-1.21.8',   loader: 'fabric',   mc: '1.21.8',  java: '21' }
          - { branch: 'fabric-1.21.11',  loader: 'fabric',   mc: '1.21.11', java: '21' }
          - { branch: 'fabric-26.1',     loader: 'fabric',   mc: '26.1',    java: '25' }
          - { branch: 'fabric-26.2',     loader: 'fabric',   mc: '26.2',    java: '25' }
          - { branch: 'fabric-26.3',     loader: 'fabric',   mc: '26.3',    java: '25' }

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      # 先装「编译目标 JDK」，让 Gradle toolchain 能在 toolcache 里找到它
      - name: Set up JDK ${{ matrix.java }} (compile target)
        if: ${{ matrix.java != '25' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # 后装「Gradle 运行 JDK」—— Fabric 的 Loom 1.18 自身要求 JVM 25，
      # 即使编译目标是 17/21；必须在最后装，保证 JAVA_HOME 指向它。
      # （少了这一步，fabric 作业会报 "Dependency requires at least JVM runtime version 25"）
      - name: Set up JDK 25 (Gradle JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Rename artifact
        if: success()
        run: |
          mkdir -p dist
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar) continue ;;
            esac
            cp "$f" "dist/xp-jetpack-${{ matrix.loader }}-${{ matrix.mc }}-${{ github.run_number }}.jar"
          done
          ls -la dist

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xp-jetpack-${{ matrix.loader }}-${{ matrix.mc }}-${{ github.run_number }}
          path: dist/*.jar
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.loader }} ${{ matrix.mc }}"
            echo ""
            echo "- job status: \`${{ job.status }}\`"
            echo "- java: ${{ matrix.java }}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish Release
    needs: build
    # 只有手动触发并勾选 release 时才发布，日常 push 只构建
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: find artifacts -name '*.jar' | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: XP Jetpack + 经验生存套件 (build ${{ github.run_number }})
          body: |
            22 个版本分支全部构建通过，附件是全部 jar，可直接下载测试。

            **经验喷气背包** — 经验驱动飞行，`/fly` 开关，空中按空格推进，鞘翅无烟花推进
            **经验生存套件** — 水下呼吸 · 防火 · 经验护盾 · 经验熔炉（全部默认开启、全自动）

            指令：`/fly` · `/xpsurvival`（别名 `/xps`）· `/respiration` `/fireproof` `/shield` `/autosmelt`

            配置文件：Forge/NeoForge 为 `config/xpjetpack-common.toml`，Fabric 为
            `config/xpjetpack.json`（功能配置另存 `config/xpjetpack-features.json`）。
          files: artifacts/**/*.jar
          draft: false
          prerelease: false
